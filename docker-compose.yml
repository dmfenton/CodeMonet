services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '8000:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AGENT_INTERVAL=${AGENT_INTERVAL:-10}
      - STATE_FILE=/app/state/state.json
    volumes:
      - server-state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  server-state:
