services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      # Platform libraries come from a local fetch of the commit server/uv.lock records;
      # scripts/docker-build.sh prepares it. For compose, point PLATFORM_SRC at such a fetch.
      additional_contexts:
        platform-src: ${PLATFORM_SRC:?build the image with scripts/docker-build.sh, or set PLATFORM_SRC}
    ports:
      - '8000:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AGENT_INTERVAL=${AGENT_INTERVAL:-10}
      - STATE_FILE=/app/state/state.json
    volumes:
      - server-state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  server-state:
