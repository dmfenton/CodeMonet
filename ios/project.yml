name: CodeMonet
options:
  bundleIdPrefix: net.dmfenton
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  FentonPlatform:
    path: ../vendor/platform.dmfenton.net/swift
  MonetKit:
    path: ./MonetKit

targets:
  CodeMonet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint >/dev/null; then
            swiftlint --quiet --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed — brew install swiftlint"
          fi
    sources:
      - path: CodeMonet
        excludes:
          - Resources/Info.plist
    resources:
      - path: CodeMonet/Resources
        excludes:
          - Info.plist
          - CodeMonet.entitlements
    dependencies:
      - package: FentonPlatform
        product: FentonDesignSystem
      - package: FentonPlatform
        product: FentonMobileCore
      - package: MonetKit
        product: MonetProtocol
      - package: MonetKit
        product: MonetStudio
      - package: MonetKit
        product: MonetPerformer
      - package: MonetKit
        product: MonetRender
      - package: MonetKit
        product: MonetNetworking
    entitlements:
      path: CodeMonet/Resources/CodeMonet.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:monet.dmfenton.net
    info:
      path: CodeMonet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Code Monet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CODE_MONET_API_BASE_URL: "$(CODE_MONET_API_BASE_URL)"
        CODE_MONET_WS_BASE_URL: "$(CODE_MONET_WS_BASE_URL)"
        CFBundleURLTypes:
          - CFBundleURLName: net.dmfenton.sketchpad.auth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - codemonet
        # Auto-declare encryption-exempt so internal TestFlight builds skip
        # the "Ready to Submit" gate and go straight to "Ready to Test". We
        # use HTTPS only — no custom crypto. (Garden and Chef do the same.)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dmfenton.sketchpad
        DEVELOPMENT_TEAM: PG5D259899
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CodeMonetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeMonetTests
    dependencies:
      - target: CodeMonet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dmfenton.sketchpad.tests
        DEVELOPMENT_TEAM: PG5D259899
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CodeMonetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeMonetUITests
    dependencies:
      - target: CodeMonet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dmfenton.sketchpad.uitests
        DEVELOPMENT_TEAM: PG5D259899
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CodeMonet:
    build:
      targets:
        CodeMonet: all
        CodeMonetTests: [test]
        CodeMonetUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - CodeMonetTests
        - CodeMonetUITests
