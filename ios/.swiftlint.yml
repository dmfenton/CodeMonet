included:
  - CodeMonet
  - CodeMonetTests
  - CodeMonetUITests

excluded:
  - build
  - DerivedData
  - Pods
  - fastlane
  - CodeMonet.xcodeproj
  - MonetKit/.build

type_body_length:
  warning: 400
  error: 500

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 1
  excluded: [id, i, j, k, n, x, y, z, t, f, q, d, vm, ns, ok, ng, to, me, xs, s, m, l, xl]

type_name:
  min_length: 2

disabled_rules:
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - trailing_closure
  - opening_brace
  - todo

opt_in_rules:
  - accessibility_label_for_image
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - implicitly_unwrapped_optional
  - last_where
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

force_cast: error
force_try: error
force_unwrapping:
  severity: error
implicitly_unwrapped_optional:
  severity: error

custom_rules:
  no_print:
    name: "No print() in app code"
    regex: '^[^"/\n]*\bprint\('
    message: "Use os_log / Logger instead of print(). Declare a Logger in the file."
    severity: warning
    excluded: ".*Tests.*"

  no_todo_without_owner:
    name: "TODO needs an owner"
    regex: '(?i)// ?TODO(?!\(.*\)|.*\[MONET-\d+\])'
    message: "Tag the TODO with an owner subsystem like // TODO(codemonet): ... or a ticket [MONET-123]"
    severity: warning

  weak_capture_in_closure:
    name: "Capture self weakly in escaping closures"
    regex: 'Task\s*\{(?!\s*\[weak self\])[^}]*\bself\.'
    message: "In escaping closures (Task, completion handlers) capture self as [weak self] or assign to a local."
    severity: warning
    excluded:
      - "CodeMonetApp.swift"

reporter: "xcode"
