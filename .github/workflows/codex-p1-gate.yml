# Managed by dmfenton/platform tools/repo-kit: change the template there and sync; never edit this copy.
name: Codex review gate
run-name: 'Codex review gate PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 0 }}'

on:
  schedule:
    - cron: '17 * * * *'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  enforce:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.base.ref)) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.review.user.login)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.comment.user.login)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.comment.user.login) ||
          (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
            (contains(github.event.comment.body, '@codex review') ||
              contains(github.event.changes.body.from, '@codex review')))))
    uses: dmfenton/codex-review-gate/.github/workflows/codex-review-gate.yml@16fc7932f33f6014292c5a11790cdeb3db2d57b7
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || '0' }}
      # Runs that execute this file as defined on main go to the persistent control lane
      # on lilserver; every other run (pull_request_review*, a branch dispatch, a stacked
      # pull request's base) to the one-job isolated pool. The lane's job-started hook
      # refuses anything else (dmfenton/platform ops/ci/README.md, "Control lane"). A
      # repository with no control pool yet routes every run to its isolated pool.
      runner_labels_json: ${{ (endsWith(github.workflow_ref, '@refs/heads/main') && contains(fromJSON('["pull_request_target","issue_comment","schedule","workflow_dispatch"]'), github.event_name)) && '["self-hosted","pr-control","codemonet-control"]' || '["self-hosted","pr-isolated","codemonet-pr"]' }}
