name: Codex review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-p1-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and invalidate pull-request head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r .head.sha <<<"$pr_data")"
          base_sha="$(jq -r .base.sha <<<"$pr_data")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the current PR head SHA."
            exit 1
          }
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the current PR base SHA."
            exit 1
          }
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=pending \
            -f context='Codex review gate' \
            -f description='Rechecking Codex comments and exact-head review'

      - name: Require current clean Codex review
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          review_data="$(gh api graphql \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    pageInfo { hasNextPage }
                    nodes {
                      isResolved
                      comments(first: 100) {
                        pageInfo { hasNextPage }
                        nodes { body createdAt updatedAt author { login } }
                      }
                    }
                  }
                }
                openPullRequests: pullRequests(states: OPEN, first: 100) {
                  pageInfo { hasNextPage }
                  nodes { number headRefOid headRepositoryOwner { login } }
                }
              }
            }')"

          truncated="$(jq '[
            .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage,
            .data.repository.openPullRequests.pageInfo.hasNextPage,
            (.data.repository.pullRequest.reviewThreads.nodes[] |
              .comments.pageInfo.hasNextPage)
          ] | any' <<<"$review_data")"
          [[ "$truncated" == false ]] || {
            echo "::error::Review pagination exceeded the fail-closed audit limit."
            exit 1
          }

          unresolved="$(jq '[
            .data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved | not)
            | .comments.nodes[]
            | select((.author.login // "") == "chatgpt-codex-connector")
          ] | length' <<<"$review_data")"
          (( unresolved == 0 )) || {
            echo "::error::$unresolved unresolved Codex review thread comment(s) remain."
            exit 1
          }

          shared_head_count="$(jq \
            --arg head "$HEAD_SHA" \
            --arg owner "$owner" \
            --argjson current "$PR_NUMBER" \
            '[.data.repository.openPullRequests.nodes[]
              | select(
                  .number != $current
                  and .headRefOid == $head
                  and (.headRepositoryOwner.login // "") == $owner
                )
            ] | length' <<<"$review_data")"
          (( shared_head_count == 0 )) || {
            echo "::error::$shared_head_count other open pull request(s) share head $HEAD_SHA."
            exit 1
          }

          base_changed_at="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events?per_page=100" \
            --jq '.[] | select(.event == "base_ref_changed") | .created_at' \
            | tail -n 1)"
          base_changed_at="${base_changed_at:-0000-01-01T00:00:00Z}"
          comments_data="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          review_requested_at="$(jq -r '
            add
            | map(select(
                (.user.login // "") != "chatgpt-codex-connector[bot]"
                and (.body // "" | test(
                  "(^|[[:space:]])@codex[[:space:]]+review([[:space:]]|$)"; "i"
                ))
              ))
            | (map(.updated_at // .created_at) | max) // "0000-01-01T00:00:00Z"
          ' <<<"$comments_data")"
          feedback_at="$(jq -r '
            [.data.repository.pullRequest.reviewThreads.nodes[].comments.nodes[]
              | select((.author.login // "") == "chatgpt-codex-connector")
              | (.updatedAt // .createdAt)
            ] | max // "0000-01-01T00:00:00Z"
          ' <<<"$review_data")"
          cutoff="$(printf '%s\n' "$base_changed_at" "$review_requested_at" "$feedback_at" \
            | sort | tail -n 1)"
          reviewed_sha="$(jq -r --arg cutoff "$cutoff" '
            add
            | map(select(
                (.user.login // "") == "chatgpt-codex-connector[bot]"
                and (.created_at // "") > $cutoff
                and (.body | test("Codex Review: Didn.t find any major issues"; "i"))
              ))
            | last
            | (.body | try capture(
                "Reviewed commit:[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{7,40})"
              ).sha catch empty)
          ' <<<"$comments_data")"

          reviewed_full_sha=""
          if [[ -n "$reviewed_sha" ]]; then
            reviewed_full_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$reviewed_sha" \
              --jq .sha 2>/dev/null || true)"
          fi
          [[ "$reviewed_full_sha" == "$HEAD_SHA" ]] || {
            echo "::error::No clean Codex review covers current head $HEAD_SHA (latest clean review: ${reviewed_full_sha:-none})."
            echo "Address every Codex comment, resolve every thread, then comment '@codex review' and wait for the exact head SHA."
            exit 1
          }

          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "Clean Codex review covers current head $HEAD_SHA; no unresolved Codex threads."

      - name: Publish gate on pull-request head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.head_sha }}
          BASE_SHA: ${{ steps.head.outputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_CUTOFF: ${{ steps.audit.outputs.cutoff }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head_sha="$(jq -r .head.sha <<<"$current_pr")"
          current_base_sha="$(jq -r .base.sha <<<"$current_pr")"
          if [[ "$AUDIT_OUTCOME" == success ]]; then
            state=success
            description='Exact-head Codex review is clean'
          else
            state=failure
            description='Codex comments or exact-head review remain'
          fi
          if [[ "$current_head_sha" != "$HEAD_SHA" || "$current_base_sha" != "$BASE_SHA" ]]; then
            state=failure
            description='Pull-request head or base changed during audit'
          fi
          if [[ "$state" == success ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY#*/}"
            # shellcheck disable=SC2016
            final_review_data="$(gh api graphql \
              -F owner="$owner" \
              -F name="$name" \
              -F number="$PR_NUMBER" \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        isResolved
                        comments(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { createdAt updatedAt author { login } }
                        }
                      }
                    }
                  }
                  openPullRequests: pullRequests(states: OPEN, first: 100) {
                    pageInfo { hasNextPage }
                    nodes { number headRefOid headRepositoryOwner { login } }
                  }
                }
              }')"
            final_truncated="$(jq '[
              .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage,
              .data.repository.openPullRequests.pageInfo.hasNextPage,
              (.data.repository.pullRequest.reviewThreads.nodes[] |
                .comments.pageInfo.hasNextPage)
            ] | any' <<<"$final_review_data")"
            final_unresolved="$(jq '[
              .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved | not)
              | .comments.nodes[]
              | select((.author.login // "") == "chatgpt-codex-connector")
            ] | length' <<<"$final_review_data")"
            final_shared_head_count="$(jq \
              --arg head "$HEAD_SHA" \
              --arg owner "$owner" \
              --argjson current "$PR_NUMBER" \
              '[.data.repository.openPullRequests.nodes[]
                | select(
                    .number != $current
                    and .headRefOid == $head
                    and (.headRepositoryOwner.login // "") == $owner
                  )
              ] | length' <<<"$final_review_data")"
            final_base_changed_at="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events?per_page=100" \
              --jq '.[] | select(.event == "base_ref_changed") | .created_at' \
              | tail -n 1)"
            final_base_changed_at="${final_base_changed_at:-0000-01-01T00:00:00Z}"
            final_comments_data="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
            final_review_requested_at="$(jq -r '
              add
              | map(select(
                  (.user.login // "") != "chatgpt-codex-connector[bot]"
                  and (.body // "" | test(
                    "(^|[[:space:]])@codex[[:space:]]+review([[:space:]]|$)"; "i"
                  ))
                ))
              | (map(.updated_at // .created_at) | max) // "0000-01-01T00:00:00Z"
            ' <<<"$final_comments_data")"
            final_feedback_at="$(jq -r '
              [.data.repository.pullRequest.reviewThreads.nodes[].comments.nodes[]
                | select((.author.login // "") == "chatgpt-codex-connector")
                | (.updatedAt // .createdAt)
              ] | max // "0000-01-01T00:00:00Z"
            ' <<<"$final_review_data")"
            final_cutoff="$(printf '%s\n' \
              "$final_base_changed_at" \
              "$final_review_requested_at" \
              "$final_feedback_at" \
              | sort | tail -n 1)"
            final_reviewed_sha="$(jq -r --arg cutoff "$final_cutoff" '
              add
              | map(select(
                  (.user.login // "") == "chatgpt-codex-connector[bot]"
                  and (.created_at // "") > $cutoff
                  and (.body | test("Codex Review: Didn.t find any major issues"; "i"))
                ))
              | last
              | (.body | try capture(
                  "Reviewed commit:[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{7,40})"
                ).sha catch empty)
            ' <<<"$final_comments_data")"
            final_reviewed_full_sha=""
            if [[ -n "$final_reviewed_sha" ]]; then
              final_reviewed_full_sha="$(gh api \
                "repos/$GITHUB_REPOSITORY/commits/$final_reviewed_sha" \
                --jq .sha 2>/dev/null || true)"
            fi
            if [[ "$final_truncated" != false \
              || "$final_unresolved" != 0 \
              || "$final_shared_head_count" != 0 \
              || "$final_cutoff" != "$AUDIT_CUTOFF" \
              || "$final_reviewed_full_sha" != "$HEAD_SHA" ]]; then
              state=failure
              description='Review activity changed during final audit'
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='Codex review gate' \
            -f description="$description"

      - name: Fail closed when review audit fails
        if: steps.audit.outcome != 'success'
        run: exit 1
