name: Codex review gate
run-name: 'Codex review gate PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 0 }}'

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  enforce:
    uses: dmfenton/codex-review-gate/.github/workflows/codex-review-gate.yml@1be59a0bb42da620daeff4da3c14502fa594688e
    with:
      pr_number: ${{ inputs.pr_number || '0' }}
