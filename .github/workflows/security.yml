name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 10
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            javascript:
              - 'package.json'
              - 'package-lock.json'
              - 'shared/package.json'
              - 'web/package.json'
              - '.github/workflows/security.yml'
            python:
              - 'server/pyproject.toml'
              - 'server/uv.lock'
              - 'scripts/audit-python-dependencies.sh'

  javascript-dependencies:
    name: JavaScript dependency audit
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 10
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      # Runtime dependencies only, like the Python audit (`uv export --no-dev`).
      # Dev tooling (Vite, ESLint, test runners) never ships; Dependabot still
      # proposes its updates. Owner decision 2026-11-17, after picomatch
      # GHSA-fc5q-39xc-vjpf had no patched release and only dev tooling used it.
      - run: npm audit --omit=dev --audit-level=low

  python-dependencies:
    name: Python dependency audit
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      # Reads only the lock (uv export --frozen): no Platform access, so no deploy key here.
      - run: bash scripts/audit-python-dependencies.sh server --no-dev

  repository:
    name: Repository and secret scan
    # Runs Trivy through a Docker daemon, so pull requests use the isolated PR
    # pool with Docker nested in the throwaway container (no secrets are read);
    # pushes and the weekly schedule keep the trusted pool.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated-docker","codemonet-pr-docker"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --user "$(id -u):$(id -g)" \
            --env TRIVY_CACHE_DIR=/tmp/trivy-cache \
            --volume "$PWD/.trivy-cache:/tmp/trivy-cache" \
            "$TRIVY_IMAGE" fs \
            --exit-code 1 \
            --no-progress \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/.trivy-cache \
            /workspace
