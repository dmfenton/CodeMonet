name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            javascript:
              - 'package.json'
              - 'package-lock.json'
              - 'app/package.json'
              - 'shared/package.json'
              - 'web/package.json'
            python:
              - 'server/pyproject.toml'
              - 'server/uv.lock'
              - 'scripts/audit-python-dependencies.sh'
              - 'fenton-platform.lock'

  javascript-dependencies:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --audit-level=low

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Resolve platform pin
        id: platform
        run: echo "sha=$(tr -d '[:space:]' < fenton-platform.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: dmfenton/fenton-platform
          ref: ${{ steps.platform.outputs.sha }}
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          path: vendor/fenton-platform
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
        working-directory: server
      - run: bash scripts/audit-python-dependencies.sh

  repository:
    name: Repository and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --exit-code 1 \
            --no-progress \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/.trivy-cache \
            /workspace
