name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pull-request code never runs on the persistent trusted pools that also serve
# releases: PRs use the disposable one-job codemonet-pr pool, or its isolated
# codemonet-pr-docker pool where a job needs Docker. Apple code is never built
# for a pull request: the author's machine checks it before the PR opens, and
# Xcode Cloud builds only releases. Pushes to main keep the trusted pools.
# Jobs that read repository secrets (the platform deploy key) never run for fork
# PRs, on any runner; CI Success fails such a PR instead of passing it unchecked.
jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 10
    # paths-filter lists PR files through the API, which needs pull-requests: read.
    # reuse-pr-result also reads the merged pull request's runs (actions: read).
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # A push whose merged pull request already passed this workflow on the identical
      # tree skips the jobs that pull request ran. iOS runs only on push, so it keeps
      # its own filter.
      server: ${{ steps.reuse.outputs.reused != 'true' && steps.filter.outputs.server || 'false' }}
      frontend: ${{ steps.reuse.outputs.reused != 'true' && steps.filter.outputs.frontend || 'false' }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
      # Vendored from dmfenton/platform: a public repository cannot use a private action.
      - id: reuse
        if: github.event_name == 'push'
        uses: ./.github/actions/reuse-pr-result
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'shared/src/auth/platform.ts'
              - 'fenton-platform.tenant.json'
              - 'scripts/worktree-bootstrap.sh'
              - 'scripts/docker-build.sh'
              - 'scripts/ci/platform-git-access.sh'
              - '.github/workflows/**'
              - 'ios/fastlane/**'
              - 'ios/project.yml'
            frontend:
              - 'web/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'

  server:
    name: Server (Python)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 20
    needs: changes
    # Reads FENTON_PLATFORM_DEPLOY_KEY: never for fork PRs.
    if: >-
      needs.changes.outputs.server == 'true' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v6

      # Tagged Platform libraries (server/uv.lock, Swift packages): fetched with the deploy key.
      - name: Platform git access
        env:
          KEY: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
        run: bash scripts/ci/platform-git-access.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --extra dev

      - name: Lint with Ruff
        working-directory: server
        run: uv run ruff check .

      - name: Format check with Ruff
        working-directory: server
        run: uv run ruff format --check .

      - name: Type check with Mypy
        working-directory: server
        run: uv run mypy code_monet

      - name: Run tests
        working-directory: server
        run: uv run python -m pytest --cov=code_monet --cov-report=xml

      - name: Check for missing migrations
        working-directory: server
        run: |
          # Create data directory for SQLite (needed for alembic to connect)
          mkdir -p data
          # Apply existing migrations to fresh database
          uv run alembic upgrade head
          # Check if models and migrations are in sync
          uv run alembic check 2>&1 || {
            echo "❌ Model changes detected without corresponding migration!"
            echo ""
            echo "Run: cd server && uv run alembic revision --autogenerate -m 'description'"
            echo "Then review and commit the generated migration."
            exit 1
          }
          echo "✅ Models and migrations are in sync"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: server/coverage.xml
          flags: server
        continue-on-error: true

  app:
    name: Frontend
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build -w shared

      - name: Lint web
        run: npm run lint -w web

      - name: Type check web
        run: npm run typecheck -w web

      - name: Test web
        run: npm run test -w web

      - name: Build web
        run: npm run build -w web

  # Replay tests validate app reducer handles real server messages
  # Uses pre-recorded fixtures - no API key needed, fast
  replay:
    name: Replay Tests
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build -w shared

      - name: Run replay tests
        run: npm run test -w web -- reducer.replay

  docker:
    name: Docker Build
    # Needs a Docker daemon, so pull requests use the isolated PR pool with Docker
    # nested in the throwaway container (never the host socket); pushes to main
    # keep the trusted pool.
    # Reads FENTON_PLATFORM_DEPLOY_KEY: never for fork PRs.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated-docker","codemonet-pr-docker"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 20
    # Independent of the Server job: both gate merge through CI Success, so the image
    # builds alongside the Python suite instead of after it.
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    # The pull-only role that reads Platform's shared Python runtime trusts only this environment.
    environment: image-build
    # id-token: that role's OIDC token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      # Tagged Platform libraries (server/uv.lock, Swift packages): fetched with the deploy key.
      - name: Platform git access
        env:
          KEY: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
        run: bash scripts/ci/platform-git-access.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The image carries the web build's pre-render bundle (web/dist/prerender).
      - name: Build web
        run: |
          npm ci
          npm run build -w shared
          npm run build -w web

      # server/Dockerfile starts from Platform's shared Python runtime in ECR; this role can only
      # pull that one repository.
      - name: Read access to the shared Python runtime
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::573988763875:role/github-actions-python-runtime-pull
          aws-region: us-east-1

      - name: Build Docker image
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$DOCKER_CONFIG"
          # Keep the runner's buildx plugin while the ECR login stays out of its shared config.
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"; fi
          scripts/docker-build.sh -t code-monet-server:ci

      - name: Verify the image pre-renders the public site
        run: |
          printf '%s' '{"pieces":[],"details":{}}' |
            docker run --rm -i --entrypoint node code-monet-server:ci /app/web/dist/prerender/prerender.mjs |
            grep -F '"path":"/gallery"' >/dev/null

      # Production passes relative data paths (compute's codemonet.env); they
      # must land on the /app/data volume, not in the image's filesystem.
      - name: Verify data paths resolve to the volume
        run: |
          docker run --rm -e CODE_MONET_ENV=ci -e DATABASE_URL=sqlite+aiosqlite:///data/drawing_agent.db \
            code-monet-server:ci /app/server/.venv/bin/python -c "
          import os
          from code_monet.config import settings
          paths = [settings.database_url.split(':///', 1)[1], settings.workspace_base_dir]
          resolved = [os.path.realpath(p) for p in paths]
          print(dict(zip(paths, resolved)))
          assert all(r.startswith('/app/data/') for r in resolved), resolved
          "

      - name: Verify the agent sandbox end to end
        run: |
          docker run --rm -i --user 1000 -e DEV_MODE=true -e SECRET_CANARY=must-not-leak \
            --tmpfs /data:uid=1000 --entrypoint /app/server/.venv/bin/python \
            code-monet-server:ci - < server/docker/sandbox_e2e.py

      # musl's default thread stack segfaulted the server on deep JSON.
      - name: Verify worker threads survive deep recursion
        run: |
          docker run --rm -i --entrypoint /app/server/.venv/bin/python \
            code-monet-server:ci - < server/docker/check_thread_stack.py

      - name: Scan Docker image
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --env TRIVY_CACHE_DIR=/tmp/trivy-cache \
            --volume "$PWD/.trivy-cache:/tmp/trivy-cache" \
            "$TRIVY_IMAGE" image \
            --exit-code 1 \
            --no-progress \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            code-monet-server:ci

  ios:
    name: iOS (Swift)
    # GitHub-hosted macOS: this repository is public, so these minutes are free,
    # and each run gets a fresh VM, so it needs no shared macOS lock and never
    # touches Daniel's laptop. Pushes to main only: the author's machine checks
    # iOS changes before a PR opens, and the job reads the Platform deploy key.
    runs-on: macos-26
    timeout-minutes: 45
    needs: changes
    # Reads FENTON_PLATFORM_DEPLOY_KEY; never runs for a pull request.
    if: needs.changes.outputs.ios == 'true' && github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      # Tagged Platform libraries (server/uv.lock, Swift packages): fetched with the deploy key.
      - name: Platform git access
        env:
          KEY: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
        run: bash scripts/ci/platform-git-access.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run MonetKit tests
        working-directory: ios/MonetKit
        run: swift test

      # Hosted runners are fresh VMs, so the job installs its own tools.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (iOS Simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project CodeMonet.xcodeproj -scheme CodeMonet \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ci-ios" \
            -scmProvider system -disableAutomaticPackageResolution \
            build CODE_SIGNING_ALLOWED=NO

  # Required status check that passes if all relevant jobs pass or are skipped
  ci-success:
    name: CI Success
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","codemonet-pr"]' || '["self-hosted","codemonet-docker","lilserver"]') }}
    timeout-minutes: 5
    needs: [changes, server, app, replay, docker, ios]
    if: always()
    steps:
      - name: Check job results
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SERVER_CHANGED: ${{ needs.changes.outputs.server }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]] || exit 1
          # Secret-reading jobs are skipped for fork PRs; do not count that as a pass.
          if [[ "$FORK_PR" == "true" && ( "$SERVER_CHANGED" == "true" || "$IOS_CHANGED" == "true" ) ]]; then
            echo "Fork PR changes server or iOS code, whose checks need repository secrets and do not run for forks." >&2
            echo "A maintainer must validate it from a branch in this repository." >&2
            exit 1
          fi
          for result in \
            "${{ needs.server.result }}" \
            "${{ needs.app.result }}" \
            "${{ needs.replay.result }}" \
            "${{ needs.docker.result }}" \
            "${{ needs.ios.result }}"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
          echo "All jobs passed or were skipped"
