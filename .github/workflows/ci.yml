name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'fenton-platform.lock'
            frontend:
              - 'app/**'
              - 'web/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'

  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Resolve platform pin
        id: platform
        run: echo "sha=$(tr -d '[:space:]' < fenton-platform.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: dmfenton/fenton-platform
          ref: ${{ steps.platform.outputs.sha }}
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          path: vendor/fenton-platform

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --extra dev

      - name: Lint with Ruff
        working-directory: server
        run: uv run ruff check .

      - name: Format check with Ruff
        working-directory: server
        run: uv run ruff format --check .

      - name: Type check with Mypy
        working-directory: server
        run: uv run mypy code_monet

      - name: Run tests
        working-directory: server
        run: uv run python -m pytest --cov=code_monet --cov-report=xml

      - name: Check for missing migrations
        working-directory: server
        run: |
          # Create data directory for SQLite (needed for alembic to connect)
          mkdir -p data
          # Apply existing migrations to fresh database
          uv run alembic upgrade head
          # Check if models and migrations are in sync
          uv run alembic check 2>&1 || {
            echo "❌ Model changes detected without corresponding migration!"
            echo ""
            echo "Run: cd server && uv run alembic revision --autogenerate -m 'description'"
            echo "Then review and commit the generated migration."
            exit 1
          }
          echo "✅ Models and migrations are in sync"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: server/coverage.xml
          flags: server
        continue-on-error: true

  app:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build -w shared

      - name: Lint
        run: npm run lint -w app

      - name: Type check
        run: npm run typecheck -w app

      - name: Run tests
        run: npm test -w app

      - name: Lint web
        run: npm run lint -w web

      - name: Type check web
        run: npm run typecheck -w web

      - name: Test web
        run: npm run test -w web

      - name: Build web
        run: npm run build -w web

  # Replay tests validate app reducer handles real server messages
  # Uses pre-recorded fixtures - no API key needed, fast
  replay:
    name: Replay Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build -w shared

      - name: Run replay tests
        run: npm run test -w app -- --testPathPattern=reducer.replay

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, server]
    if: needs.changes.outputs.server == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Resolve platform pin
        id: platform
        run: echo "sha=$(tr -d '[:space:]' < fenton-platform.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: dmfenton/fenton-platform
          ref: ${{ steps.platform.outputs.sha }}
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          path: vendor/fenton-platform

      - name: Build Docker image
        run: docker build -t code-monet-server:ci -f server/Dockerfile .

      - name: Scan Docker image
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --exit-code 1 \
            --no-progress \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            code-monet-server:ci

  # Required status check that passes if all relevant jobs pass or are skipped
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [server, app, replay, docker]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.server.result }}" == "failure" || "${{ needs.app.result }}" == "failure" || "${{ needs.replay.result }}" == "failure" || "${{ needs.docker.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed or were skipped"
