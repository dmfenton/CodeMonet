name: TestFlight Deploy

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.2.3-beta, etc.
  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false
        type: string
      force:
        description: 'Force build even if no iOS changes detected'
        required: false
        type: boolean
        default: false

concurrency:
  group: codemonet-testflight
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for iOS changes
    # Tag push / workflow_dispatch only: trusted pool.
    runs-on: [self-hosted, codemonet-docker, lilserver]
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if iOS-related files changed
        id: check
        run: |
          # Force build if manually triggered with force flag
          if [ "${{ inputs.force }}" == "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
            echo "Force build requested"
            exit 0
          fi

          # Get the previous tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, building"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Comparing $PREVIOUS_TAG to $CURRENT_TAG"

          # Check for changes in iOS-related paths (code that affects the iOS app)
          IOS_PATHS="ios/ fenton-platform.lock"

          CHANGED_FILES=$(git diff --name-only "$PREVIOUS_TAG" "$CURRENT_TAG")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any iOS-related files changed
          IOS_CHANGES=""
          for path in $IOS_PATHS; do
            if echo "$CHANGED_FILES" | grep -q "^$path"; then
              IOS_CHANGES="$IOS_CHANGES $path"
            fi
          done

          if [ -n "$IOS_CHANGES" ]; then
            echo "iOS-related changes detected in:$IOS_CHANGES"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
          else
            echo "No iOS-related changes detected, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No changes in ios/ or fenton-platform.lock since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

  build-ios:
    name: Build & Deploy iOS
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    # Dedicated signing account on the laptop pool: never shared with fork PR
    # code (this workflow only ever runs from tags / workflow_dispatch).
    runs-on: [self-hosted, codemonet-ios, laptop, dedicated-signing]
    # Lock-wait budget (60m) + build/upload headroom (90m): must exceed the
    # wait budget below, since a concurrent ci.yml iOS run can legitimately
    # hold the lock for most of its own wait window before this job's build
    # and TestFlight upload ever start.
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Acquire shared macOS CI lock
        env:
          LOCK_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.job }}
        # wait_seconds=3600 (60m, leaves >=90m of the 150m job timeout for
        # the actual build+upload). stale_seconds=9000 (150m): longer than
        # any job that can hold this lock, so a live job's lock is never
        # mistaken for one abandoned by a dead runner.
        run: .github/scripts/macos-ci-lock.sh acquire "$LOCK_OWNER" 3600 9000

      - name: Resolve platform pin
        id: platform
        run: echo "sha=$(tr -d '[:space:]' < fenton-platform.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout Fenton platform
        uses: actions/checkout@v6
        with:
          repository: dmfenton/platform.dmfenton.net
          ref: ${{ steps.platform.outputs.sha }}
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          path: vendor/platform.dmfenton.net

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){2}([-.][A-Za-z0-9_.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Generate build number from timestamp
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Build Number: $BUILD_NUMBER"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Set up Ruby (Homebrew)
        run: |
          RUBY_BIN="/opt/homebrew/opt/ruby@3.2/bin"
          RUBY_GEM_BIN="/opt/homebrew/lib/ruby/gems/3.2.0/bin"
          test -x "$RUBY_BIN/ruby"
          echo "$RUBY_BIN" >> "$GITHUB_PATH"
          echo "$RUBY_GEM_BIN" >> "$GITHUB_PATH"
          export PATH="$RUBY_BIN:$RUBY_GEM_BIN:$PATH"
          ruby -e \
            'require "rubygems"; abort "Ruby 3.2+ required" if Gem::Version.new(RUBY_VERSION) < Gem::Version.new("3.2")'

      - name: Install Fastlane
        working-directory: ios
        run: |
          gem install bundler -v 2.6.9
          bundle _2.6.9_ config set path "$RUNNER_TEMP/bundle"
          bundle _2.6.9_ install

      - name: Set up shared iOS signing
        uses: ./vendor/platform.dmfenton.net/.github/actions/isolated-ios-signing
        with:
          certificate-p12-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          # The dedicated-signing runner account; the action refuses to sign
          # on a self-hosted runner unless it runs as this user.
          expected-user: fenton-ci

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/codemonet.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" >/dev/null
          echo "IOS_PROVISIONING_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bundle _2.6.9_ exec fastlane ios beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeMonet-${{ steps.version.outputs.version }}.ipa
          path: ios/build/CodeMonet.ipa
          retention-days: 30

      - name: Clean up shared iOS signing
        if: always()
        uses: ./vendor/platform.dmfenton.net/.github/actions/isolated-ios-signing
        with:
          mode: cleanup
          keychain-path: ${{ env.FENTON_IOS_KEYCHAIN_PATH }}
          search-list-path: ${{ env.FENTON_IOS_SEARCH_LIST_PATH }}

      - name: Clean up provisioning profile
        if: always()
        run: rm -f "$RUNNER_TEMP/codemonet.mobileprovision"

      - name: Release shared macOS CI lock
        if: always()
        env:
          LOCK_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.job }}
        run: .github/scripts/macos-ci-lock.sh release "$LOCK_OWNER"

  skip-report:
    name: Report Skipped Build
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'false'
    runs-on: [self-hosted, codemonet-docker, lilserver]
    timeout-minutes: 5
    steps:
      - name: Report skip reason
        run: |
          echo "## TestFlight Build Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ needs.check-changes.outputs.skip_reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To force a build, manually trigger the workflow with the 'Force build' option enabled." >> $GITHUB_STEP_SUMMARY
