name: Publish Fenton tenant manifest

on:
  push:
    branches: [main]
    paths:
      - 'fenton-platform.tenant.json'
      - '.github/workflows/publish-tenant-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codemonet-tenant-manifest
  cancel-in-progress: false

jobs:
  publish:
    # Push to main / workflow_dispatch only: AWS OIDC + SSM needs the trusted pool.
    runs-on: [self-hosted, codemonet-docker, lilserver]
    # Above the shared publisher's 25-minute activation budget plus checkout and credentials.
    timeout-minutes: 40
    environment: codemonet-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::573988763875:role/github-actions-codemonet-release
          aws-region: us-east-1
      # Platform owns the publisher (.github/actions/publish-tenant-manifest). This public
      # repository cannot use actions from the private Platform repository, so it checks that
      # one directory out at a pinned commit with the read-only deploy key and runs its script.
      - name: Check out Platform's tenant manifest publisher
        uses: actions/checkout@v6
        with:
          repository: dmfenton/platform
          ref: 3eb101ae6737b3e832c49010a578bdc9cfda12fa # platform#519
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false
          path: .fenton-platform
          sparse-checkout: .github/actions/publish-tenant-manifest
      - name: Publish and activate CodeMonet manifest
        env:
          AWS_REGION: us-east-1
          FENTON_PLATFORM_INSTANCE_ID: i-0819504ca9b2d967b
          GH_TOKEN: ${{ github.token }}
        run: .fenton-platform/.github/actions/publish-tenant-manifest/publish-tenant-manifest.sh codemonet
