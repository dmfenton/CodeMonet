name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: drawing-agent
  ECR_SSR_REPOSITORY: web-ssr

concurrency:
  group: codemonet-production
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: codemonet-production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve platform pin
        id: platform
        run: echo "sha=$(tr -d '[:space:]' < fenton-platform.lock)" >> "$GITHUB_OUTPUT"

      - name: Require exact main release source
        run: |
          git fetch origin main --no-tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]

      - uses: actions/checkout@v6
        with:
          repository: dmfenton/fenton-platform
          ref: ${{ steps.platform.outputs.sha }}
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          path: vendor/fenton-platform

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){2}([-.][A-Za-z0-9_.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 2
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install server dependencies
        working-directory: server
        run: uv sync --frozen --extra dev

      - name: Run server tests
        working-directory: server
        run: uv run pytest -q

      - name: Build web frontend
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          npm ci
          npm run build -w shared
          npm run build -w web
          # Write version file for nginx to serve
          echo "$VERSION" > web/dist/version.txt
          echo "Web frontend built successfully (v$VERSION)"
          ls -la web/dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::573988763875:role/github-actions-codemonet-release
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Get build metadata
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the image with version info
          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg APP_COMMIT="$COMMIT_SHA" \
            --build-arg APP_BUILD_TIME="$BUILD_TIME" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:v$VERSION \
            -f server/Dockerfile \
            .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:v$VERSION $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --exit-code 1 --no-progress --scanners vuln,secret --severity HIGH,CRITICAL \
            $ECR_REGISTRY/$ECR_REPOSITORY:v$VERSION

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:v$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Build, tag, and push SSR image to Amazon ECR
        id: build-ssr
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Build the SSR image
          docker build \
            --build-arg VERSION="$VERSION" \
            -t $ECR_REGISTRY/$ECR_SSR_REPOSITORY:$GITHUB_SHA \
            -t $ECR_REGISTRY/$ECR_SSR_REPOSITORY:v$VERSION \
            -f web/Dockerfile \
            .
          docker tag $ECR_REGISTRY/$ECR_SSR_REPOSITORY:v$VERSION $ECR_REGISTRY/$ECR_SSR_REPOSITORY:latest

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --exit-code 1 --no-progress --scanners vuln,secret --severity HIGH,CRITICAL \
            $ECR_REGISTRY/$ECR_SSR_REPOSITORY:v$VERSION

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_SSR_REPOSITORY:v$VERSION
          docker push $ECR_REGISTRY/$ECR_SSR_REPOSITORY:$GITHUB_SHA
          docker push $ECR_REGISTRY/$ECR_SSR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_SSR_REPOSITORY:$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Sync web build to S3
        # nginx.conf, docker-compose.prod.yml, start-services.sh, otel-config.yaml
        # are owned by dmfenton/compute and uploaded by its deploy-nginx workflow.
        # This step only pushes CodeMonet's SSR client/server assets.
        run: |
          BUCKET="compute-deploy-573988763875"
          echo "Syncing web build to s3://${BUCKET}/deploy/web/"
          aws s3 sync web/dist/ "s3://${BUCKET}/deploy/web/" --delete

      - name: Run database migrations
        run: |
          echo "Running database migrations with new image..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0819504ca9b2d967b \
            --document-name "Compute-MigrateCodeMonet" \
            --parameters "ImageTag=$GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in {1..30}; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0819504ca9b2d967b \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/30: Migration status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Migrations completed successfully"
              # Show output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0819504ca9b2d967b \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Migration failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0819504ca9b2d967b \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Migration timed out"
            exit 1
          fi

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract this version's section from CHANGELOG.md
          # Matches from "## [X.Y.Z]" until the next "## [" or end of file
          CHANGELOG=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            echo "No changelog entry found for v$VERSION, using git log"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
            else
              CHANGELOG=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
            fi
          fi

          # Write to output using delimiter
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Docker Images

            **Backend API:**
            ```
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v${{ steps.version.outputs.version }}
            ```

            **Web SSR Server:**
            ```
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SSR_REPOSITORY }}:v${{ steps.version.outputs.version }}
            ```

            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Deployment

            - **Server**: Deployed via SSM (explicit docker-compose restart)
            - **iOS**: TestFlight build triggered (see Actions tab)
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Deploy to production
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Deploying v$VERSION to production..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0819504ca9b2d967b \
            --document-name "Compute-DeployCodeMonet" \
            --parameters "ImageTag=$GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment command to complete
          for i in {1..30}; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0819504ca9b2d967b \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/30: Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment command completed"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0819504ca9b2d967b \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0819504ca9b2d967b \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment timed out"
            exit 1
          fi

      - name: Verify deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Verifying v$VERSION is running..."

          # Wait up to 3 minutes for both backend and SSR to be healthy
          # (drawing-agent takes ~60-90s to come up after a recreate)
          for i in {1..36}; do
            sleep 5

            # Check backend version
            RESPONSE=$(curl -sf https://monet.dmfenton.net/api/version 2>/dev/null || echo '{}')
            DEPLOYED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')

            # Check SSR health
            SSR_RESPONSE=$(curl -sf https://monet.dmfenton.net/ssr-health 2>/dev/null || echo '{}')
            SSR_STATUS=$(echo "$SSR_RESPONSE" | jq -r '.status // empty')

            if [ "$DEPLOYED_VERSION" = "$VERSION" ] && [ "$SSR_STATUS" = "healthy" ]; then
              echo "✅ Backend deployed: v$VERSION"
              echo "✅ SSR status: $SSR_STATUS"
              exit 0
            fi

            echo "Attempt $i/36: Backend='${DEPLOYED_VERSION:-unknown}' (want '$VERSION'), SSR='${SSR_STATUS:-unknown}' (want 'healthy')"
          done

          echo "❌ Deployment verification failed after 3 minutes"
          echo "Expected backend: $VERSION, got: $DEPLOYED_VERSION"
          echo "Expected SSR: healthy, got: $SSR_STATUS"
          exit 1

      - name: Summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image**: \`$ECR_REGISTRY/$ECR_REPOSITORY:v$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SSR Image**: \`$ECR_REGISTRY/$ECR_SSR_REPOSITORY:v$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ✅ Verified running at https://monet.dmfenton.net/api/version" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS**: TestFlight build triggered" >> $GITHUB_STEP_SUMMARY
