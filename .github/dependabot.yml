version: 2

multi-ecosystem-groups:
  weekly-runtime:
    schedule:
      interval: weekly
      day: monday
      time: "08:10"
      timezone: America/New_York

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-runtime
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-runtime
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo upgrades own these native compatibility sets. Patch updates remain
      # visible; minor/major updates move with a validated Expo SDK migration.
      - dependency-name: 'expo*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@expo/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'react-native*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@react-native*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@shopify/react-native-skia'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  - package-ecosystem: uv
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: weekly-runtime
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /server
      - /web
    patterns: ["*"]
    multi-ecosystem-group: weekly-runtime
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
