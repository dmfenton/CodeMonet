repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (server)
        entry: bash -c 'cd server && uv run ruff check --fix .'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format (server)
        entry: bash -c 'cd server && uv run ruff format .'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
      - id: npm-lockfile-sync
        name: npm lockfile in sync (npm ci)
        entry: npm ci --dry-run --ignore-scripts --no-audit --no-fund
        language: system
        files: (^|/)package(-lock)?\.json$
        pass_filenames: false
