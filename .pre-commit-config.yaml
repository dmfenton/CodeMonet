repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (server)
        entry: bash -c 'cd server && uv run ruff check --fix .'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format (server)
        entry: bash -c 'cd server && uv run ruff format .'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
      - id: npm-lockfile-sync
        name: npm lockfile in sync (npm ci)
        # Also require CI's platform binaries: a lock regenerated over existing
        # node_modules drops them (npm/cli#4828) and breaks Linux CI.
        entry: bash -c 'npm ci --dry-run --ignore-scripts --no-audit --no-fund && grep -q "node_modules/@rollup/rollup-linux-x64-gnu" package-lock.json || { echo "package-lock.json lacks Linux optional deps; rebuild from main lock with npm install"; exit 1; }'
        language: system
        files: (^|/)package(-lock)?\.json$
        pass_filenames: false
      - id: workflow-contracts
        name: workflow contract tests (server)
        entry: bash -c 'cd server && uv run pytest -q tests/test_testflight_signing.py tests/test_release_contract.py tests/test_tenant_manifest.py'
        language: system
        files: ^(\.github/workflows/|ios/fastlane/|ios/project\.yml|server/Dockerfile)
        pass_filenames: false
